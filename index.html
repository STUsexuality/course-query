<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國際專修部 - 學生課表快速查詢系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @media print {
            .no-print { display: none !important; }
            .printable-card { border: 1px solid #e2e8f0 !important; box-shadow: none !important; }
        }

</head>
<body class="h-full text-slate-800 antialiased flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Top Header Navigation -->
    <header class="bg-gradient-to-r from-slate-900 via-brand-900 to-indigo-950 text-white shadow-md no-print sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600/90 border border-brand-400/30 flex items-center justify-center text-white shadow-inner">
                    <i data-lucide="globe" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight tracking-wide flex items-center gap-2">
                        國際專修部 課表查詢系統
                        <span class="text-[10px] font-normal px-2 py-0.5 rounded-full bg-brand-500/30 border border-brand-400/30 text-brand-200">115-1 學期</span>
                    </h1>
                    <p class="text-xs text-slate-300 font-light">International Student Course Schedule Query System</p>
                </div>
            </div>

            <div id="live-time" class="hidden sm:flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/60 text-xs font-mono text-slate-300">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-brand-400"></i>
                <span id="time-display">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

                <label for="student-search-input" class="block text-sm font-bold text-slate-700 flex items-center space-x-2">
                    <i data-lucide="search" class="w-4 h-4 text-brand-600"></i>
                    <span>請輸入學生學號查詢個人課表：</span>
                </label>

                <div class="relative flex items-center">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="id-card" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="student-search-input" 
                        class="block w-full pl-11 pr-28 py-3.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 font-mono font-bold text-base sm:text-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all"
                        placeholder="例如：26F10125, 26F10119..."
                        autocomplete="off"
                        onkeydown="if(event.key === 'Enter') performSearch()">
                    <button onclick="performSearch()" 
                        class="absolute right-2 px-5 py-2.5 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-medium rounded-lg shadow-sm transition flex items-center space-x-1.5">
                        <span>查詢</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Quick Test Buttons (Classes A ~ H) -->
                <div class="pt-2">
                    <div class="text-xs text-slate-500 font-semibold mb-2 flex items-center gap-1">
                        <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-500"></i>
                        <span>快速示範點擊測試（各班學生）：</span>
                    </div>
                    <div class="flex flex-wrap gap-1.5 text-xs">
                        <button onclick="quickTest('26F10125')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 hover:border-brand-300 text-slate-700 font-mono font-medium rounded-lg border border-slate-200 transition">A班 (26F10125)</button>
                        <button onclick="quickTest('26F10119')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 hover:border-brand-300 text-slate-700 font-mono font-medium rounded-lg border border-slate-200 transition">B班 (26F10119)</button>
                        <button onclick="quickTest('26F13108')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 hover:border-brand-300 text-slate-700 font-mono font-medium rounded-lg border border-slate-200 transition">C班 (26F13108)</button>
                        <button onclick="quickTest('26F22120')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 hover:border-brand-300 text-slate-700 font-mono font-medium rounded-lg border border-slate-200 transition">D班 (26F22120)</button>

                        <button onclick="quickTest('26F22128')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 hover:border-brand-300 text-slate-700 font-mono font-medium rounded-lg border border-slate-200 transition">F班 (26F22128)</button>
                        <button onclick="quickTest('26F01106')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 hover:border-brand-300 text-slate-700 font-mono font-medium rounded-lg border border-slate-200 transition">G班 (26F01106)</button>
                        <button onclick="quickTest('26F22109')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 hover:border-brand-300 text-slate-700 font-mono font-medium rounded-lg border border-slate-200 transition">H班 (26F22109)</button>
                    </div>
                </div>
            </div>
        </section>

            <div class="flex items-center space-x-3">
                <i data-lucide="alert-circle" class="w-5 h-5 text-rose-500 shrink-0"></i>
                <div class="flex-1">
                    <h3 class="text-sm font-bold text-rose-800">查無學生資料</h3>

            </div>
        </div>

                        <i data-lucide="calendar-day" class="w-4 h-4"></i>
                        <span>當日課表 (Today)</span>
                    </button>
                    <button id="tab-btn-weekly" onclick="switchScheduleTab('weekly')"

                    <span class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                        <i data-lucide="calendar" class="w-4 h-4 text-brand-600"></i>
                        <span>選擇上課星期：</span>
                    </span>
                    <div class="flex space-x-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="selectDay(1)" id="day-btn-1" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">週一</button>
                        <button onclick="selectDay(2)" id="day-btn-2" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">週二</button>
                        <button onclick="selectDay(3)" id="day-btn-3" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">週三</button>
                        <button onclick="selectDay(4)" id="day-btn-4" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">週四</button>
                        <button onclick="selectDay(5)" id="day-btn-5" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">週五</button>
                    </div>
                </div>

                <div id="today-schedule-list" class="space-y-3">
                    <!-- Dynamic rendering by JS -->
                </div>
            </div>

            <div id="tab-content-weekly" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200/90 overflow-hidden">
                <div class="overflow-x-auto p-3 sm:p-5">
                    <div id="weekly-grid-container" class="min-w-[680px] grid grid-cols-6 gap-2 text-xs">
                        <!-- Dynamic rendering by JS -->
                    </div>
                </div>
            </div>

        </section>

        <!-- Initial Welcome Placeholder State -->
        <section id="welcome-placeholder" class="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-8 text-center my-6">
            <div class="max-w-md mx-auto space-y-4">
                <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                    <i data-lucide="search" class="w-8 h-8"></i>
                </div>

                </p>
            </div>
        </section>

        // State Variables

        window.addEventListener('DOMContentLoaded', () => {
            startClock();
            autoSetDefaultDay();
            lucide.createIcons();
            
            // Default query for seamless user experience
            quickTest('26F10125');
        });

        function startClock() {
            const timeEl = document.getElementById('time-display');
            const update = () => {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString('zh-TW', { hour12: false });
            };
            update();
            setInterval(update, 1000);
        }

        function autoSetDefaultDay() {
            const now = new Date();
            let day = now.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat
            if (day === 0 || day === 6) {
                selectedDay = 1; // Default Monday if weekend
            } else {
                selectedDay = day;
            }
        }

        function performSearch() {
            const input = document.getElementById('student-search-input');
            const queryId = input.value.trim().toUpperCase();

            if (!queryId) {
                showError("請輸入學生學號！");
                return;
            }

            const student = studentsData.find(s => s.id === queryId);

            if (student) {
                hideError();
                currentStudent = student;
                renderStudentProfile(student);
                renderScheduleViews();
                
                // Toggle display
                document.getElementById('welcome-placeholder').classList.add('hidden');
                document.getElementById('student-profile-card').classList.remove('hidden');
                document.getElementById('schedule-section').classList.remove('hidden');
            } else {
                showError(`查無學號 [ ${queryId} ] 之學生資料，請確認學號或更換測試學號。`);
            }
        }

        function quickTest(studentId) {
            document.getElementById('student-search-input').value = studentId;
            performSearch();
        }

        function showError(msg) {
            const banner = document.getElementById('error-banner');
            document.getElementById('error-msg').textContent = msg;
            banner.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-banner').classList.add('hidden');
        }

        function renderStudentProfile(student) {
            document.getElementById('student-cn-name').textContent = student.name;
            document.getElementById('student-en-name').textContent = student.enName;
            document.getElementById('student-id-display').textContent = student.id;
            document.getElementById('student-dept-display').querySelector('span').textContent = student.dept;
            document.getElementById('student-class-badge').textContent = `${student.class} 班`;
            document.getElementById('student-avatar').textContent = student.name.charAt(0);
        }

        function switchScheduleTab(tab) {
            activeScheduleTab = tab;
            const btnToday = document.getElementById('tab-btn-today');
            const btnWeekly = document.getElementById('tab-btn-weekly');
            const contentToday = document.getElementById('tab-content-today');
            const contentWeekly = document.getElementById('tab-content-weekly');

            if (tab === 'today') {
                btnToday.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center space-x-2 transition-all bg-brand-600 text-white shadow-sm";
                btnWeekly.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-2 transition-all";
                contentToday.classList.remove('hidden');
                contentWeekly.classList.add('hidden');
            } else {
                btnWeekly.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center space-x-2 transition-all bg-brand-600 text-white shadow-sm";
                btnToday.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-2 transition-all";
                contentWeekly.classList.remove('hidden');
                contentToday.classList.add('hidden');
            }
            renderScheduleViews();
        }

        function selectDay(dayNum) {
            selectedDay = dayNum;
            renderScheduleViews();
        }

        function updateDayButtonsUI() {
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`day-btn-${i}`);
                if (i === selectedDay) {
                    btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition bg-white text-brand-700 shadow-sm border border-slate-200/80";
                } else {
                    btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-800 transition";
                }
            }
        }

        function renderScheduleViews() {
            if (!currentStudent) return;

            updateDayButtonsUI();

            const studentClass = currentStudent.class;
            const fullSchedule = classSchedules[studentClass] || {};

            // 1. Render Today Schedule List
            const todayListContainer = document.getElementById('today-schedule-list');
            todayListContainer.innerHTML = '';

            const daySchedule = fullSchedule[selectedDay] || {};
            let hasCourses = false;

            PERIOD_SLOTS.forEach(slot => {
                const course = daySchedule[slot.period];
                if (course) {
                    hasCourses = true;
                    const card = document.createElement('div');
                    card.className = "flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 rounded-xl bg-slate-50 border border-slate-200/80 hover:border-brand-300 hover:bg-brand-50/30 transition gap-3";

                    card.innerHTML = `
                        <div class="flex items-start space-x-3.5">
                            <div class="px-2.5 py-1 bg-white border border-slate-200 text-slate-700 font-mono font-bold text-xs rounded-lg text-center shrink-0 shadow-2xs">
                                <span>${slot.label}</span>
                                <span class="block text-[10px] text-slate-400 font-normal mt-0.5">${slot.time}</span>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-900">${course.name}</h4>
                                <div class="flex items-center space-x-3 text-xs text-slate-500 mt-1">
                                    <span class="flex items-center gap-1"><i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i> ${course.teacher}</span>
                                    <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i> ${course.room}</span>
                                </div>
                            </div>
                        </div>
                        <span class="px-2.5 py-1 bg-brand-100 text-brand-800 text-[11px] font-bold rounded-md shrink-0 self-end sm:self-center">
                            正課
                        </span>
                    `;
                    todayListContainer.appendChild(card);
                }
            });

            if (!hasCourses) {
                todayListContainer.innerHTML = `
                    <div class="p-8 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200 text-slate-400">
                        <i data-lucide="coffee" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
                        <p class="text-xs font-semibold">今天沒有排課，好好休息！</p>
                    </div>
                `;
            }

            // 2. Render Weekly Schedule Grid (5 Days x 10 Periods)
            const gridContainer = document.getElementById('weekly-grid-container');
            gridContainer.innerHTML = '';

            const weekdays = ["節次 / 時間", "星期一", "星期二", "星期三", "星期四", "星期五"];

            // Header Row
            weekdays.forEach((dayTitle, idx) => {
                const header = document.createElement('div');
                const isSelected = idx === selectedDay;
                header.className = `p-2.5 text-center font-bold text-xs rounded-lg border ${
                    isSelected ? 'bg-brand-600 text-white border-brand-700' : 'bg-slate-100 text-slate-700 border-slate-200'
                }`;
                header.textContent = dayTitle;
                gridContainer.appendChild(header);
            });

            // Grid Rows (Periods 1 ~ 8, L, E)
            PERIOD_SLOTS.forEach(slot => {
                // Period Column Header
                const timeCol = document.createElement('div');
                timeCol.className = "p-2 bg-slate-50 rounded-lg border border-slate-200/80 text-center font-mono flex flex-col justify-center items-center";
                timeCol.innerHTML = `
                    <span class="font-bold text-slate-700">${slot.label}</span>
                    <span class="text-[9px] text-slate-400 leading-tight mt-0.5">${slot.time.split(' - ')[0]}</span>
                `;
                gridContainer.appendChild(timeCol);

                // Monday to Friday Cells
                for (let day = 1; day <= 5; day++) {
                    const daySchedule = fullSchedule[day] || {};
                    const course = daySchedule[slot.period];

                    const cell = document.createElement('div');

                    if (course) {
                        cell.className = "p-2 rounded-lg border border-brand-200 bg-brand-50/70 hover:bg-brand-100/80 transition flex flex-col justify-between shadow-2xs";
                        cell.innerHTML = `
                            <div>
                                <span class="font-bold text-brand-900 text-[11px] leading-snug block">${course.name}</span>
                            </div>
                            <div class="mt-1.5 text-[10px] text-slate-600 space-y-0.5">
                                <div class="truncate"><i data-lucide="user" class="w-2.5 h-2.5 inline mr-0.5"></i>${course.teacher}</div>
                                <div class="font-medium text-brand-700"><i data-lucide="map-pin" class="w-2.5 h-2.5 inline mr-0.5"></i>${course.room}</div>
                            </div>
                        `;
                    } else {
                        cell.className = "p-2 rounded-lg border border-slate-100 bg-slate-50/40 text-center flex items-center justify-center text-slate-300";
                        cell.innerHTML = `<span class="text-[10px]">-</span>`;
                    }

                    gridContainer.appendChild(cell);
                }
            });

            // Re-initialize Lucide Icons after rendering content
            lucide.createIcons();
        }
